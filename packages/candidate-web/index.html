<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Simulator</title>
<meta name="theme-color" content="#1b4a78">
<meta name="description" content="PMP exam practice and full mock exams, in Arabic and English.">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout idea: one calm column for study screens; the exam screen shows only the question, timer and controls. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --border: #d5dbe3; --text: #121a26; --muted: #505c6c;
  --primary: #1b4a78; --primary-soft: #e3edf7; --on-primary: #ffffff;
  --good: #17694a; --good-soft: #e1f3ea; --bad: #a3281c; --bad-soft: #fbe6e3; --warn: #8a5a00; --warn-soft: #fbefd2;
  --font: "IBM Plex Sans", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --surface: #18202a; --border: #2c3846; --text: #eef1f5; --muted: #a3afbd;
    --primary: #86b8ea; --primary-soft: #1c2f44; --on-primary: #0b1620;
    --good: #63cf98; --good-soft: #15301f; --bad: #f29186; --bad-soft: #3a1b18; --warn: #e6b955; --warn-soft: #35290f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #18202a; --border: #2c3846; --text: #eef1f5; --muted: #a3afbd;
  --primary: #86b8ea; --primary-soft: #1c2f44; --on-primary: #0b1620;
  --good: #63cf98; --good-soft: #15301f; --bad: #f29186; --bad-soft: #3a1b18; --warn: #e6b955; --warn-soft: #35290f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); }
[dir="rtl"] body { line-height: 1.7; }
#app { max-width: 760px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
header.top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); flex-wrap: wrap; }
body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); padding-bottom: env(safe-area-inset-bottom); }
#netbar { position: sticky; top: 0; z-index: 5; background: var(--warn-soft); color: var(--warn); text-align: center; padding: 6px 12px; font-size: 14px; }
#netbar[hidden] { display: none; }
header.top .brand { font-weight: 600; font-size: 17px; flex: 1; }
nav.tabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--border); overflow-x: auto; }
nav.tabs a { color: var(--muted); text-decoration: none; padding: 10px 12px; font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
@media (max-width: 480px) { nav.tabs { padding: 0 4px; gap: 0; } nav.tabs a { padding: 10px 9px; } }
main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 22px; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.card.accent { border-color: var(--primary); background: var(--primary-soft); }
.big { font-size: 26px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
label.inline { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; color: var(--text); font-size: 15px; }
input, select, textarea { font: inherit; font-weight: 400; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; min-height: 44px; }
input[type="checkbox"] { min-height: 0; width: 18px; height: 18px; }
button, .btn { font: inherit; font-weight: 600; font-size: 15px; min-height: 44px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
button.primary, .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
button.small { min-height: 38px; padding: 6px 12px; font-size: 14px; font-weight: 500; }
button.danger { border-color: var(--bad); color: var(--bad); }
button[aria-pressed="true"] { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.msg { padding: 10px 14px; border-radius: 8px; }
.msg.err { background: var(--bad-soft); color: var(--bad); }
.msg.ok { background: var(--good-soft); color: var(--good); }
.msg.info { background: var(--primary-soft); color: var(--text); }
.msg a { color: var(--primary); font-weight: 600; }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.price { color: var(--primary); }
button:disabled { opacity: .5; cursor: not-allowed; }
.card > .btn { align-self: flex-start; }
.note { font-size: 13.5px; color: var(--muted); border-inline-start: 3px solid var(--warn); padding-inline-start: 10px; }
/* Question content is written in English and always reads left to right. */
.content { direction: ltr; text-align: left; }
.stem { white-space: pre-wrap; }
.qwrap[data-ql="ar"] .ql-en, .qwrap[data-ql="en"] .ql-ar { display: none; }
.qwrap .ql-ar { display: block; text-align: right; }
.qwrap[data-ql="ar"] .opt { flex-direction: row-reverse; text-align: right; }
.ql-bar { justify-content: flex-end; margin-bottom: 6px; }
.stem-ar { color: var(--muted); font-size: 15px; border-top: 1px solid var(--border); padding-top: 6px; margin-top: 4px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; font: inherit; line-height: 1.45; padding: 12px 14px; min-height: 48px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; width: 100%; font-weight: 400; justify-content: flex-start; }
.opt .mark { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.opt.multi .mark { border-radius: 5px; }
.opt[aria-checked="true"] { border-color: var(--primary); background: var(--primary-soft); }
.opt[aria-checked="true"] .mark { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.opt.is-right { border-color: var(--good); background: var(--good-soft); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt .why { display: block; font-size: 14px; color: var(--muted); margin-top: 4px; }
.verdict { font-weight: 600; padding: 10px 14px; border-radius: 8px; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }
.tag { display: inline-block; font-size: 12.5px; font-weight: 500; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
.examhead { display: flex; align-items: center; gap: 10px; font-size: 14px; flex-wrap: wrap; }
.examhead .grow { flex: 1; }
.timer { font-weight: 600; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.timer.low { color: var(--bad); }
.progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--primary); }
details.case { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
details.case summary { cursor: pointer; font-weight: 600; font-size: 14.5px; }
details.tips { margin-bottom: 8px; } details.tips ul { margin: 10px 0 2px; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 8px; line-height: 1.6; }
.exhibit { display: flex; flex-direction: column; gap: 4px; }
.exhibit img { align-self: flex-start; max-width: 100%; max-height: 420px; height: auto; object-fit: contain; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
.exhibit .wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: start; }
th { background: var(--bg); font-weight: 600; }
.foot { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; direction: ltr; }
.cell { min-height: 42px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; position: relative; padding: 0; }
.cell.done { background: var(--primary-soft); border-color: var(--primary); }
.cell.flag::after { content: "⚑"; position: absolute; top: 0; right: 4px; font-size: 11px; color: var(--warn); }
.cell.current { outline: 2px solid var(--text); }
.bar { display: grid; grid-template-columns: minmax(110px, 36%) 1fr 64px; gap: 8px; align-items: center; font-size: 14px; }
.bar .track, .track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
.bar .track i, .track i { display: block; height: 100%; background: var(--primary); border-radius: 5px; }
.bar .num { text-align: end; font-variant-numeric: tabular-nums; font-weight: 600; direction: ltr; }
.auth { width: min(420px, 100%); margin: 24px auto; }
.links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
a { color: var(--primary); }
.saving { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .progress > i, .bar .track i { transition: width .2s ease-out; } }
</style>
</head>

function bars(rows, label) {

      <button class="primary" type="submit">${t("signIn")}</button><div class="links"><a href="#register">${t("noAccount")}</a><a href="#forgot">${t("forgot")}</a></div>`,
    register: `<h1>${t("register")}</h1><label>${t("email")}<input id="email" type="email" autocomplete="username" required></label><label>${t("password")}<input id="password" type="password" autocomplete="new-password" minlength="10" required><span class="muted">${t("pwHint")}</span></label>
      <label class="inline"><input type="checkbox" id="terms"> ${t("acceptTerms")}</label>${S.site && (S.site.termsUrl || S.site.privacyUrl) ? `<div class="links">${S.site.termsUrl ? `<a href="${esc(S.site.termsUrl)}" target="_blank" rel="noopener" id="terms-link">${t("termsLink")}</a>` : ""}${S.site.privacyUrl ? `<a href="${esc(S.site.privacyUrl)}" target="_blank" rel="noopener" id="privacy-link">${t("privacyLink")}</a>` : ""}</div>` : ""}<button class="primary" type="submit">${t("register")}</button><div class="links"><a href="#signin">${t("haveAccount")}</a></div>`,
    forgot: `<h1>${t("forgot")}</h1><label>${t("email")}<input id="email" type="email" required></label><button class="primary" type="submit">${t("sendLink")}</button><div class="links"><a href="#signin">${t("signIn")}</a></div>`,
    reset: `<h1>${t("resetTitle")}</h1><label>${t("newPassword")}<input id="password" type="password" autocomplete="new-password" minlength="10" required><span class="muted">${t("pwHint")}</span></label><button class="primary" type="submit">${t("save")}</button>`,
  };
  shell(`<form class="card auth" id="auth">${forms[kind]}<div id="msg"></div></form><p class="note">${t("notice")}</p>`);

      if (kind === "signin") {
        const body = { email: $("#email").value.trim(), password: $("#password").value };

        catch (e) { if (e.code === "mfa_required") { $("#otp-wrap").hidden = false; $("#otp").focus(); } throw e; }
        S.access = tk.accessToken; S.refresh = tk.refreshToken;
        await afterSignIn();
      } else if (kind === "register") {
        if (!$("#terms").checked) return show("err", t("acceptTerms"));
        await raw("POST", "/auth/register", { email: $("#email").value.trim(), password: $("#password").value, acceptTerms: true, language: S.lang });

        await raw("POST", "/auth/password/reset-request", { email: $("#email").value.trim() });
        show("ok", t("resetSent"));

        flash("ok", t("resetDone")); location.hash = "#signin";
      }
    } catch (e) { show("err", errText(e)); }
  };

async function startPractice(req) {
  try {
    const endpoint = req.mode === "adaptive" ? "/practice/adaptive" : "/practice/sessions";
    const s = await api("POST", endpoint, req);
    S.practice = { session: s, i: 1, q: null, sel: [], fb: null, started: Date.now(), deadline: s.timeLimitSeconds ? Date.now() + s.timeLimitSeconds * 1000 : null, adaptive: req.mode === "adaptive" };
    location.hash = "#practice/run"; render();
  } catch (e) { flash("err", e.code === "no_questions_match" ? t("noMatch") : e.code === "daily_limit_reached" ? t("freeOut") : errText(e)); location.hash = "#practice"; render(); }
}
async function practiceRunView() {
  const seq = S.seq; // a newer screen started meanwhile → do not paint this one
  const p = S.practice;
  if (!p) { location.hash = "#practice"; return; }
  if (p.i > p.session.questionCount || (p.deadline && Date.now() > p.deadline && !p.fb)) {
    const sum = await api("GET", `/practice/sessions/${p.session.id}/summary`);
    paint(seq, `<h1>${t("summary")}</h1><div class="card"><span class="big">${sum.overall.correct} / ${sum.overall.total}</span><span class="muted">${esc(sum.disclaimer)}</span></div>

    S.practice = null; return;
  }
  if (!p.q) { p.q = await api("GET", `/practice/sessions/${p.session.id}/questions/${p.i}`); p.started = Date.now(); }
  const head = `<div class="examhead"><span class="grow">${t("ofq", p.i, p.session.questionCount)}</span>${p.q.taskName ? `<span class="tag">${esc(p.q.taskName)}</span>` : ""}${p.deadline ? `<span class="timer" id="ptimer">${fmt(p.deadline - Date.now())}</span>` : ""}</div><div class="progress"><i style="width:${Math.round(((p.i - 1) / p.session.questionCount) * 100)}%"></i></div>`;
  if (p.fb) {
    paint(seq, head + feedbackHtml(p.q, p.sel, p.fb) + `<button class="primary" id="next">${p.i < p.session.questionCount ? t("next") : t("finish")}</button>`);
    bindReport();
    $("#next").onclick = () => { p.i++; p.q = null; p.sel = []; p.fb = null; render(); };
  } else {
    const hintTypes = S.lang === "ar"
      ? { general: "تلميح عام", approach: "المنهج", eliminate: "استبعاد", explain: "تفسير" }
      : { general: "General hint", approach: "Approach", eliminate: "Eliminate", explain: "Explain" };
    const hintBar = p.q.id ? `<div id="hintbar" style="margin-top:4px"><details><summary style="cursor:pointer;color:var(--primary);font-size:14px;font-weight:600">🧠 ${S.lang === "ar" ? "مساعدة المدرب" : "Coach help"}</summary><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${Object.entries(hintTypes).map(([k,v]) => `<button class="btn small" data-hint="${k}">${esc(v)}</button>`).join("")}</div><div id="hintout" style="margin-top:8px"></div></details></div>` : "";
    paint(seq, head + questionHtml(p.q, p.sel, false) + hintBar + `<button class="primary" id="check"${p.sel.length ? "" : " disabled"}>${t("check")}</button><div id="msg"></div>`);
    bindOptions(p.q, p.sel, (sel) => { p.sel = sel; $("#check").disabled = sel.length === 0; });
    $("#check").onclick = async () => {
      try {
        p.fb = await api("POST", `/practice/sessions/${p.session.id}/questions/${p.i}/answer`, { selectedOptionIds: p.sel, timeSpentMs: Date.now() - p.started });
        // For adaptive sessions, also record the response for the algorithm
        if (p.adaptive && p.q.id && p.q.taskCode) {
          const correct = p.fb.correct === true;
          api("POST", "/practice/adaptive/response", { questionId: p.q.id, taskId: p.q.taskCode, correct, source: "adaptive" }).catch(() => {});
        }
        render();
      } catch (e) { $("#msg").innerHTML = `<p class="msg err">${esc(errText(e))}</p>`; }
    };
    // AI coach hints
    document.querySelectorAll("[data-hint]").forEach((b) => (b.onclick = async () => {
      const hintout = $("#hintout"); if (!hintout) return;
      hintout.innerHTML = `<p class="muted" style="font-size:13px">⏳</p>`;
      try {
        const res = await api("POST", "/coach/hint", { questionId: p.q.id, hintType: b.dataset.hint });
        const quota = res.usedToday !== undefined ? `<span class="muted" style="font-size:11px">${res.usedToday}/3 ${S.lang === "ar" ? "تلميحات اليوم" : "hints today"}</span>` : "";
        hintout.innerHTML = `<div class="msg info" style="font-size:14px">${esc(res.hint || "")}</div>${quota}`;
      } catch (e) {
        const msg = e?.status === 429 ? (S.lang === "ar" ? "استنفدت تلميحاتك اليوم" : "Daily hint limit reached") : errText(e);
        hintout.innerHTML = `<p class="msg err" style="font-size:13px">${esc(msg)}</p>`;
      }
    }));
  }
  if (p.deadline) S.timers.push(setInterval(() => { const el = $("#ptimer"); if (el) { el.textContent = fmt(p.deadline - Date.now()); el.classList.toggle("low", p.deadline - Date.now() < 60000); } if (Date.now() > p.deadline && !p.fb) render(); }, 1000));
}
// Option buttons: single choice replaces, multiple response toggles up to the number to choose.
function bindOptions(q, initial, onChange) {
  let sel = initial.slice();
  document.querySelectorAll(".opt[data-opt]").forEach((b) => (b.onclick = () => {
    const id = b.dataset.opt;
    if (q.type === "single") sel = [id];
    else if (sel.includes(id)) sel = sel.filter((x) => x !== id);
    else if (sel.length < q.selectCount) sel = [...sel, id];
    document.querySelectorAll(".opt[data-opt]").forEach((o) => o.setAttribute("aria-checked", String(sel.includes(o.dataset.opt))));
    onChange(sel);
  }));
}

async function openExam(id, status) {
  clearTimers();
  const st = status || (await api("GET", "/exams/attempts/" + id));
  S.exam = { id, status: st, synced: Date.now(), section: null, i: 0, answers: {}, flags: new Set(), seq: 1, pending: new Map(), mode: "question", offline: false };
  if (st.status === "submitted" || st.status === "expired") { location.hash = "#result/" + id; return; }
  location.hash = "#exam"; await loadSection(); render();
}
async function loadSection() {
  const ex = S.exam;
  if (ex.status.status !== "in_progress") return;
  const sec = await api("GET", `/exams/attempts/${ex.id}/sections/${ex.status.currentSection}/questions`);
  ex.section = sec; ex.i = 0; ex.answers = {}; ex.flags = new Set();
  for (const a of sec.savedAnswers) { ex.answers[a.ordinal] = a.selectedOptionIds; if (a.flagged) ex.flags.add(a.ordinal); ex.seq = Math.max(ex.seq, a.clientSeq + 1); }
}
const remaining = () => { const ex = S.exam; return ex.status.status === "on_break" ? ex.status.remainingMs : ex.status.remainingMs - (Date.now() - ex.synced); };
function syncStatus(st) { S.exam.status = st; S.exam.synced = Date.now(); }
async function refreshStatus() { syncStatus(await api("GET", "/exams/attempts/" + S.exam.id)); }

// Every change is saved at once; failures retry every 3 seconds until the server confirms.
async function save(ordinal) {
  const ex = S.exam;
  const body = { selectedOptionIds: ex.answers[ordinal] || [], flagged: ex.flags.has(ordinal), clientSeq: ex.seq++ };
  ex.pending.set(ordinal, body); paintSaving();
  try {
    const r = await api("PUT", `/exams/attempts/${ex.id}/answers/${ordinal}`, body);
    if (ex.pending.get(ordinal) === body) ex.pending.delete(ordinal);
    ex.offline = false; ex.status.remainingMs = r.remainingMs; ex.synced = Date.now();
  } catch (e) {
    if (e instanceof ApiError && e.status === 409) { await refreshStatus(); ex.pending.clear(); return render(); }
    ex.offline = true;
    setTimeout(() => { if (S.exam === ex && ex.pending.get(ordinal) === body) { ex.pending.delete(ordinal); save(ordinal); } }, 3000);
  }
  paintSaving();
}
function paintSaving() {

}
const current = () => S.exam.section?.questions[S.exam.i];

async function examView() {
  const seq = S.seq; // a newer screen started meanwhile → do not paint this one
  const ex = S.exam;
  if (!ex) { location.hash = "#mock"; return; }
  if (remaining() <= 0 && ex.status.status === "in_progress") await refreshStatus();
  const st = ex.status;
  if (st.status === "submitted" || st.status === "expired") { if (st.status === "expired") flash("err", t("expiredMsg")); location.hash = "#result/" + ex.id; return; }
  const timer = `<span class="timer${remaining() < 300000 ? " low" : ""}" id="timer" aria-label="${t("timeLeft")}">${fmt(remaining())}</span>`;
  const sections = st.sections;
  const last = st.currentSection === sections.length - 1;

  if (st.status === "on_break") {
    const ends = Date.now() + (st.breakRemainingMs || 0);
    paint(seq, `<h1>${t("breakTitle")}</h1><div class="card"><span class="big timer" id="btimer">${fmt(ends - Date.now())}</span><p>${t("breakText")}</p><p class="muted">${t("timeLeft")}: ${timer}</p></div><button class="primary" id="resume">${t("resumeNow")}</button>`, { exam: true });
    $("#resume").onclick = async () => { syncStatus(await api("POST", `/exams/attempts/${ex.id}/resume`)); await loadSection(); render(); };
    S.timers.push(setInterval(async () => { const left = ends - Date.now(); const b = $("#btimer"); if (b) b.textContent = fmt(left); if (left <= 0) { clearTimers(); await refreshStatus(); await loadSection(); render(); } }, 500));
    return;
  }
  if (!ex.section || ex.section.sectionIndex !== st.currentSection) await loadSection();
  const qs = ex.section.questions;

  if (ex.mode === "review") {
    // Let answers still being saved reach the server before counting.
    for (let i = 0; ex.pending.size && i < 40; i++) await new Promise((r) => setTimeout(r, 150));
    const rv = await api("GET", `/exams/attempts/${ex.id}/sections/${st.currentSection}/review`);
    paint(seq, `<div class="examhead"><strong class="grow">${t("reviewTitle")}</strong>${timer}</div>${gridHtml(qs)}
      <div class="tiles"><div class="card"><span class="muted">${t("unanswered")}</span><span class="big">${rv.unanswered.length}</span></div><div class="card"><span class="muted">${t("flagged")}</span><span class="big">${rv.flagged.length}</span></div></div>
      <p class="note">${last ? t("submitWarn") : t("lockWarn")}</p><button class="primary" id="close">${last ? t("submitExam") : t("closeSection")}</button><button id="back">${t("backToQ")}</button>`, { exam: true });
    bindGrid(qs);
    $("#back").onclick = () => { ex.mode = "question"; render(); };
    $("#close").onclick = async () => {
      try {
        if (last) { await api("POST", `/exams/attempts/${ex.id}/submit`); location.hash = "#result/" + ex.id; }
        else { syncStatus(await api("POST", `/exams/attempts/${ex.id}/sections/${st.currentSection}/close`)); ex.mode = "question"; ex.section = null; render(); }
      } catch (e) { flash("err", errText(e)); render(); }
    };
    startClock(); return;
  }
  if (ex.mode === "nav") {
    paint(seq, `<div class="examhead"><strong class="grow">${t("navigator")}</strong>${timer}</div>${gridHtml(qs)}<button id="back">${t("backToQ")}</button>`, { exam: true });
    bindGrid(qs); $("#back").onclick = () => { ex.mode = "question"; render(); };
    startClock(); return;
  }

  const q = qs[ex.i];
  const sel = ex.answers[q.ordinal] || [];
  const cs = q.caseKey ? ex.section.caseStudies[q.caseKey] : null;
  paint(seq, `<div class="examhead"><span class="grow">${t("section", st.currentSection + 1)} · ${sections[st.currentSection].kind === "case" ? t("secCase") : t("secInd")} · ${t("ofq", q.ordinal, 180)}</span>${timer}</div>
    <div class="progress"><i style="width:${Math.round((q.ordinal / 180) * 100)}%"></i></div>
    ${cs ? `<details class="case"${q.ordinal === cs.firstOrdinal ? " open" : ""}><summary>${t("scenario")}: <span class="content">${esc(cs.title)}</span></summary><div class="content" style="margin-top:8px"><p class="stem">${esc(cs.scenario)}</p>${(cs.exhibits || []).map(exhibitHtml).join("")}</div></details>` : ""}
    ${questionHtml(q, sel, false)}
    <div class="examhead"><button class="small" id="clear"${sel.length ? "" : " disabled"}>${t("clear")}</button><span class="grow"></span><span class="saving" id="saving" aria-live="polite"></span></div>
    <div class="foot"><button class="small" id="prev"${ex.i === 0 ? " disabled" : ""}>${t("prev")}</button><button class="small" id="flag" aria-pressed="${ex.flags.has(q.ordinal)}">${t("flag")}</button><button class="small" id="navb">${t("navigator")}</button><button class="small primary" id="next">${ex.i === qs.length - 1 ? t("reviewBtn") : t("next")}</button></div>`, { exam: true });
  paintSaving();
  bindOptions(q, sel, (s) => { ex.answers[q.ordinal] = s; $("#clear").disabled = s.length === 0; save(q.ordinal); });
  $("#clear").onclick = () => { ex.answers[q.ordinal] = []; save(q.ordinal); render(); };
  $("#flag").onclick = () => { if (ex.flags.has(q.ordinal)) ex.flags.delete(q.ordinal); else ex.flags.add(q.ordinal); save(q.ordinal); $("#flag").setAttribute("aria-pressed", String(ex.flags.has(q.ordinal))); };
  $("#prev").onclick = () => { ex.i--; render(); window.scrollTo(0, 0); };
  $("#next").onclick = () => { if (ex.i === qs.length - 1) ex.mode = "review"; else ex.i++; render(); window.scrollTo(0, 0); };
  $("#navb").onclick = () => { ex.mode = "nav"; render(); };
  startClock();
}
function gridHtml(qs) {
  const ex = S.exam;
  return `<div class="grid">${qs.map((q, i) => `<button class="cell${(ex.answers[q.ordinal] || []).length ? " done" : ""}${ex.flags.has(q.ordinal) ? " flag" : ""}${i === ex.i ? " current" : ""}" data-go="${i}" aria-label="${q.ordinal}">${q.ordinal}</button>`).join("")}</div>`;
}
function bindGrid() { document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => { S.exam.i = Number(b.dataset.go); S.exam.mode = "question"; render(); })); }
function startClock() {
  S.timers.push(setInterval(async () => {
    const el = $("#timer"); const left = remaining();
    if (el) { el.textContent = fmt(left); el.classList.toggle("low", left < 300000); }
    if (left <= 0) { clearTimers(); await refreshStatus(); render(); }
  }, 500));
}

async function verifyCertificate(token) {
  // Public page — no sign-in needed. Fetches /verify/:token unauthenticated.
  const seq = S.seq;
  let data;
  try { data = await raw("GET", "/verify/" + encodeURIComponent(token)); } catch { data = null; }
  if (!data) {
    shell(`<div class="card"><h2>❌ ${S.lang === "ar" ? "الشهادة غير موجودة" : "Certificate not found"}</h2><p class="muted">${S.lang === "ar" ? "تحقق من الرابط أو اطلب من صاحب الشهادة إعادة إرساله." : "Check the link or ask the holder to resend it."}</p></div>`);
    return;
  }
  const badge = data.revoked
    ? `<div class="card" style="border-color:var(--bad);background:var(--bad-soft)"><h2 style="color:var(--bad)">❌ ${S.lang === "ar" ? "شهادة ملغاة" : "Revoked certificate"}</h2></div>`
    : `<div class="card" style="border-color:var(--good)"><h2>🏅 ${S.lang === "ar" ? "أكمل اختباراً تجريبياً كاملاً" : "Completed a full mock exam"}</h2></div>`;
  const dateStr = new Date(data.issued_at).toLocaleDateString(S.lang === "ar" ? "ar-EG" : "en-GB", { year: "numeric", month: "long", day: "numeric" });
  paint(seq, `<h1>${S.lang === "ar" ? "التحقق من الشهادة" : "Certificate verification"}</h1>${badge}
    <div class="card">
      <div class="row"><span class="muted">${S.lang === "ar" ? "المتقدم" : "Candidate"}:</span><strong>${esc(data.user_display)}</strong></div>
      <div class="row"><span class="muted">${S.lang === "ar" ? "النتيجة" : "Score"}:</span><strong>${data.score_percent}%</strong></div>
      <div class="row"><span class="muted">${S.lang === "ar" ? "تاريخ الإصدار" : "Issued"}:</span><span>${esc(dateStr)}</span></div>
    </div>
    <p class="note">${S.lang === "ar" ? "هذه الشهادة صادرة عن محاكي PMP Master ولا تعادل شهادة PMP الرسمية من PMI." : "This certificate is from PMP Master Simulator and is not equivalent to the official PMI PMP credential."}</p>`);
}

async function statsView() {
  const seq = S.seq; // a newer screen started meanwhile → do not paint this one
  const [dom, app, snaps] = await Promise.all([
    api("GET", "/me/analytics?dimension=domain"),
    api("GET", "/me/analytics?dimension=approach"),
    api("GET", "/me/weekly-snapshots").catch(() => ({ items: [] })),
  ]);
  if (!dom.rows.length) return paint(seq, `<h1>${t("statsTitle")}</h1><p class="muted">${t("noStats")}</p>`);
  const task = await api("GET", "/me/analytics?dimension=task");
  const weakest = task.rows.filter((r) => r.total >= 3).sort((a, b) => a.percent - b.percent).slice(0, 8);

  // Build weekly activity mini-chart (last 8 weeks)
  const weeks = (snaps.items || []).slice(0, 8).reverse();
  const maxQ = Math.max(1, ...weeks.map((w) => w.questions_answered));
  const weekChart = weeks.length
    ? `<div class="card"><h2>${S.lang === "ar" ? "النشاط الأسبوعي" : "Weekly activity"}</h2>
        <div style="display:flex;align-items:flex-end;gap:6px;height:70px;overflow:hidden" aria-label="${S.lang === "ar" ? "أسابيع" : "weeks"}">
          ${weeks.map((w) => {
            const h = Math.max(4, Math.round((w.questions_answered / maxQ) * 60));
            const pct = w.questions_answered ? Math.round((w.questions_correct / w.questions_answered) * 100) : 0;
            const label = new Date(w.week_start).toLocaleDateString(S.lang === "ar" ? "ar-EG" : "en-GB", { month: "short", day: "numeric" });
            return `<div title="${label}: ${w.questions_answered} ${S.lang === "ar" ? "سؤال" : "Qs"} · ${pct}% ${S.lang === "ar" ? "صح" : "correct"}" style="flex:1;background:var(--primary);border-radius:4px 4px 0 0;height:${h}px;min-width:0;opacity:.85"></div>`;
          }).join("")}
        </div>
        <p class="muted" style="font-size:12px">${S.lang === "ar" ? "كل عمود يمثل أسبوع — الارتفاع = عدد الأسئلة" : "Each bar = one week · height = questions answered"}</p>
      </div>`
    : "";

  // streak badge from weekly snapshots
  const totalStreak = (() => { let s = 0; for (const w of [...(snaps.items || [])].reverse()) { if (w.questions_answered > 0) s = w.streak_days || s; } return s; })();
  const streakBadge = totalStreak > 0
    ? `<div class="card" style="display:flex;align-items:center;gap:12px;padding:12px 16px"><span style="font-size:28px">🔥</span><div><p style="margin:0;font-weight:700;font-size:18px">${totalStreak} ${S.lang === "ar" ? "يوم" : "day"} streak</p><small class="muted">${S.lang === "ar" ? "نشاط متواصل" : "consecutive study"}</small></div></div>`
    : "";
  paint(seq, `<h1>${t("statsTitle")}</h1>
    <div class="row" style="margin-bottom:8px"><span></span><button class="btn small" id="refreshSnaps">${S.lang === "ar" ? "🔄 تحديث البيانات" : "🔄 Refresh data"}</button></div>
    ${streakBadge}${weekChart}
    <div class="card"><h2>${t("byDomain")}</h2>${bars(dom.rows, domainName)}</div>
    <div class="card"><h2>${t("byApproach")}</h2>${bars(app.rows, (k) => t(k))}</div>
    ${weakest.length ? `<div class="card"><h2>${t("byTask")}</h2>${bars(weakest, taskName)}</div>` : ""}
    <p class="muted">${t("estimate")}</p>`);
  $("#refreshSnaps")?.addEventListener("click", async () => {
    const btn = $("#refreshSnaps"); if (btn) { btn.disabled = true; btn.textContent = "⏳"; }

// ------------------------------------------------------------ Google Play Billing (inside the Android app)

// In the Android app (a Trusted Web Activity installed from Google Play),
// passes are bought through Google Play Billing, as Play requires for digital
// goods. Elsewhere this returns null and the web plan screen is shown.
async function playBilling() {
  if (S.play !== undefined) return S.play;
  S.play = null;
  if ("getDigitalGoodsService" in window) {
    try { S.play = await window.getDigitalGoodsService("https://play.google.com/billing"); } catch { S.play = null; }
  }
  return S.play;
}
/** Sends purchases the server has not completed yet (for example after a lost connection). */
async function settlePlayPurchases() {
  const play = await playBilling();
  if (!play || !S.access) return;
  try {
    for (const p of await play.listPurchases()) {
      try { await api("POST", "/billing/purchases", { platform: "google", productId: p.itemId, purchaseToken: p.purchaseToken }); } catch {}
    }
  } catch {}
}
async function buyOnPlay(sku) {
  const request = new PaymentRequest([{ supportedMethods: "https://play.google.com/billing", data: { sku } }],
    { total: { label: "Total", amount: { currency: "USD", value: "0" } } }); // required by the API, ignored by Google Play
  const response = await request.show();
  try {
    await api("POST", "/billing/purchases", { platform: "google", productId: sku, purchaseToken: response.details.purchaseToken });
    await response.complete("success");
    return true;
  } catch (e) {
    await response.complete(e.code === "store_completion_failed" ? "success" : "fail");
    if (e.code === "store_completion_failed") return true; // the pass is active; completion is retried later
    throw e;
  }
}

async function planView() {
  const seq = S.seq; // a newer screen started meanwhile → do not paint this one
  const play = await playBilling();
  const region = S.region || (S.lang === "ar" ? "EG" : "INTL");
  const [acc, plans] = await Promise.all([api("GET", "/me/access"), api("GET", "/plans?region=" + region)]);
  // Google Play product ids may be stored on any region's price row.
  let playItems = new Map();
  if (play) {
    const lists = await Promise.all(["EG", "GULF", "INTL"].map((r) => api("GET", "/plans?region=" + r)));
    const skuByPlan = new Map();
    for (const list of lists) for (const p of list.items) if (p.price?.storeProductId && !skuByPlan.has(p.code)) skuByPlan.set(p.code, p.price.storeProductId);
    try {
      const details = skuByPlan.size ? await play.getDetails([...skuByPlan.values()]) : [];
      for (const [code, sku] of skuByPlan) { const d = details.find((x) => x.itemId === sku); if (d) playItems.set(code, { sku, price: d.price }); }
    } catch { playItems = new Map(); }
  }
  const status = acc.entitled
    ? `<span class="big">${t("planPass")}</span>${acc.endsAt ? `<span class="muted">${esc(t("until", dateText(acc.endsAt)))}</span>` : ""}`
    : `<span class="big">${t("planFree")}</span><span class="muted">${esc(t("freeLeft", acc.practiceLeftToday, acc.freeDailyPractice))}</span>`;
  const playPrice = (pr) => { try { return new Intl.NumberFormat(S.lang === "ar" ? "ar-EG" : "en-GB", { style: "currency", currency: pr.currency }).format(Number(pr.value)); } catch { return pr.value + " " + pr.currency; } };
  const card = (p) => {
    const item = playItems.get(p.code);
    const price = p.kind === "free" ? ""
      : play ? (item ? `<span class="big price">${esc(playPrice(item.price))}</span><button class="primary" data-buy="${esc(item.sku)}">${t("buy")}</button>` : `<span class="muted">${t("notOnSale")}</span>`)
      : p.price ? `<span class="big price">${esc(money(p.price))}</span>` : `<span class="muted">${t("notOnSale")}</span>`;
    return `<div class="card plan" data-plan="${esc(p.code)}"><h2>${esc(p.kind === "free" ? t("planFree") : t("planPass") + " · " + t("days", p.durationDays))}</h2>
    <span class="muted">${p.kind === "free" ? t("freeDesc") : t("passDesc")}</span>${price}</div>`;
  };
  paint(seq, `<h1>${t("plan")}</h1><div class="card accent" id="status">${status}</div><div id="buymsg"></div>
    <form class="card" id="redeem"><h2>${t("redeemTitle")}</h2><span class="muted">${t("redeemHint")}</span>
      <label>${t("code")}<input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" required placeholder="XXXX-XXXX-XXXX" dir="ltr"></label>
      <button class="primary" type="submit">${t("redeem")}</button><div id="rmsg"></div></form>
    <h2>${t("plansTitle")}</h2>
    ${play ? "" : `<label>${t("region")}<select id="region">${Object.entries(T[S.lang].regions).map(([k, v]) => `<option value="${k}"${k === region ? " selected" : ""}>${v}</option>`).join("")}</select></label>`}
    <div class="plans">${plans.items.map(card).join("")}</div>
    ${play ? `<p class="note">${t("playNote")}</p>` : `<p class="note">${t("buyNote")}</p>`}<p class="note">${t("notice")}</p>`);
  if ($("#region")) $("#region").onchange = () => { S.region = $("#region").value; render(); };
  document.querySelectorAll("[data-buy]").forEach((b) => (b.onclick = async () => {
    b.disabled = true;
    try { if (await buyOnPlay(b.dataset.buy)) { flash("ok", t("bought")); render(); } }
    catch (e) { if (e && e.name !== "AbortError") $("#buymsg").innerHTML = `<p class="msg err" role="alert">${esc(errText(e))}</p>`; b.disabled = false; }
  }));
  $("#redeem").onsubmit = async (ev) => {
    ev.preventDefault();
    try { await api("POST", "/me/redeem", { code: $("#code").value }); flash("ok", t("redeemed")); render(); }
    catch (e) { $("#rmsg").innerHTML = `<p class="msg err" role="alert">${esc(errText(e))}</p>`; }
  };
}

// Chrome and Edge offer an install prompt; Safari on iOS needs Share → Add to Home Screen.
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); S.installPrompt = e; if ((location.hash || "").startsWith("#settings")) render(); });
window.addEventListener("appinstalled", () => { S.installPrompt = null; });
function installCard() {
  if (standalone()) return "";
  if (S.installPrompt) return `<div class="card"><h2>${t("install")}</h2><p class="muted">${t("installText")}</p><button id="install">${t("install")}</button></div>`;
  if (isIos()) return `<div class="card"><h2>${t("install")}</h2><p class="muted">${t("iosInstall")}</p></div>`;
  return "";
}
document.addEventListener("click", async (e) => {
  if (!e.target.closest || !e.target.closest("#install") || !S.installPrompt) return;
  S.installPrompt.prompt();
  await S.installPrompt.userChoice.catch(() => null);
  S.installPrompt = null;
  render();
});
const paintNet = () => { const bar = $("#netbar"); bar.textContent = t("offlineBar"); bar.hidden = navigator.onLine; };

window.addEventListener("offline", paintNet);
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("/sw.js", { scope: "/app" }).catch(() => {});
}

// TIPS is the offline copy. The live text comes from GET /tips, which staff
// edit in the admin panel; the built-in copy is used only if that fails.
function renderTips(sections) {
  const ar = S.lang === "ar";
  return `<h1>${t("tips")}</h1><p class="muted">${t("tipsIntro")}</p>
    ${sections.map((g, i) => `<details class="case tips"${i === 0 ? " open" : ""}><summary>${esc(ar ? g.ar : g.en)}</summary><ul>${g.items.map((it) => `<li>${esc(ar ? it.ar : it.en)}</li>`).join("")}</ul></details>`).join("")}
    <p class="muted">${t("tipsNote")}</p>`;
}
const BUILTIN_TIPS = () => TIPS.map((g) => ({ en: g.en, ar: g.ar, items: g.items.map(([en, ar]) => ({ en, ar })) }));
async function tipsView() {
  const seq = S.seq;
  shell(renderTips(S.tipsCache || BUILTIN_TIPS()));
  try {
    const data = await raw("GET", "/tips");
    const live = (data.items || []).map((g) => ({ en: g.titleEn, ar: g.titleAr, items: g.items || [] }));
    if (live.length) { S.tipsCache = live; paint(seq, renderTips(live)); }
  } catch { /* keep the built-in copy */ }
}

async function caseStudyView(id) {
  const seq = S.seq;
  shell(`<p class="muted">⏳</p>`);
  const cs = await api("GET", "/case-studies/" + id).catch(() => null);
  if (!cs) { paint(seq, `<p class="msg err">${S.lang === "ar" ? "دراسة الحالة غير موجودة." : "Case study not found."}</p>`); return; }
  const title = S.lang === "ar" && cs.titleAr ? cs.titleAr : cs.title || "";
  const desc = S.lang === "ar" && cs.descriptionAr ? cs.descriptionAr : cs.description || "";
  const questions = cs.questions || [];
  paint(seq, `<a class="btn small" href="#case-studies" style="margin-bottom:4px">← ${S.lang === "ar" ? "العودة" : "Back"}</a>
    <h1>${esc(title)}</h1>
    ${desc ? `<div class="card"><p>${esc(desc)}</p></div>` : ""}
    ${cs.exhibit ? `<div class="card" style="font-size:14px;border-left:3px solid var(--primary)"><p><strong>${S.lang === "ar" ? "معلومات المشروع:" : "Project info:"}</strong></p><p>${esc(cs.exhibit)}</p></div>` : ""}
    <div style="display:flex;flex-direction:column;gap:14px">
    ${questions.map((q, idx) => {
      const stem = S.lang === "ar" && q.stemAr ? q.stemAr : q.stem || "";
      return `<div class="card"><p style="font-weight:600;margin-bottom:8px">${idx + 1}. ${esc(stem)}</p>
        ${(q.options || []).map((o) => `<div class="opt" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer" data-copt="${esc(o.id)}" data-cq="${esc(q.id)}">${esc(S.lang === "ar" && o.textAr ? o.textAr : o.text || "")}</div>`).join("")}
        <div id="cfb-${esc(q.id)}" style="margin-top:6px"></div>
      </div>`;
    }).join("")}
    </div>`);
  // Bind case study question options (self-contained, no session)
  document.querySelectorAll("[data-copt]").forEach((opt) => (opt.onclick = async () => {
    const qid = opt.dataset.cq, oid = opt.dataset.copt;
    const q = questions.find((x) => x.id === qid); if (!q) return;
    const correct = (q.correctOptionIds || [q.correctOptionId]).filter(Boolean);
    const isRight = correct.includes(oid);
    document.querySelectorAll(`[data-cq="${qid}"]`).forEach((o) => {
      o.style.background = "";
      if (correct.includes(o.dataset.copt)) o.style.background = "var(--good-soft)";
      else if (o.dataset.copt === oid && !isRight) o.style.background = "var(--bad-soft)";
    });
    const fbEl = document.getElementById("cfb-" + qid);
    if (fbEl) fbEl.innerHTML = `<p class="msg ${isRight ? "ok" : "err"}" style="font-size:13px">${isRight ? (S.lang === "ar" ? "✓ صحيح" : "✓ Correct") : (S.lang === "ar" ? "✗ خطأ" : "✗ Incorrect")}${q.explanation ? " — " + esc(S.lang === "ar" && q.explanationAr ? q.explanationAr : q.explanation) : ""}</p>`;
  }));
}

// ------------------------------------------------------------ deep analytics view

async function analyticsView() {
  const seq = S.seq;
  shell(`<h1>${t("statsTitle")}</h1><p class="muted">⏳</p>`);
  const [domains, difficulty, mastery, errors, profile] = await Promise.all([
    api("GET", "/me/analytics/domains").catch(() => ({ items: [] })),
    api("GET", "/me/analytics/difficulty").catch(() => ({ items: [] })),
    api("GET", "/me/mastery").catch(() => ({ items: [] })),
    api("GET", "/me/errors").catch(() => ({ items: [] })),
    api("GET", "/me/profile").catch(() => null),
  ]);
  const domItems = domains.items || [];
  const diffItems = difficulty.items || [];
  const mastItems = mastery.items || [];
  const errItems = errors.items || [];

  const pctColor = (p) => p >= 75 ? "var(--good)" : p >= 50 ? "#f59e0b" : "var(--bad)";
  const masteryBar = (item) => {
    const pct = typeof item.accuracy === "number" ? Math.round(item.accuracy * 100) : 0;
    const masteryLabel = item.mastery || item.masteryLevel || "";
    const name = domainName(item.domainCode || item.domain || "") || item.domain || "";
    return `<div style="margin-bottom:10px">
      <div class="row" style="margin-bottom:4px"><span>${esc(name)}</span>${masteryLabel ? `<span class="tag" style="font-size:11px">${esc(masteryLabel)}</span>` : ""}<span class="muted" style="font-size:12px;margin-left:auto">${item.total || 0} ${t("totalAtt")} · ${pct}%</span></div>
      <div class="track" style="height:8px;border-radius:4px"><i style="width:${Math.min(pct,100)}%;height:8px;border-radius:4px;background:${pctColor(pct)};display:block"></i></div>
    </div>`;
  };

  const diffBands = { easy: t("diffEasy"), medium: t("diffMedium"), hard: t("diffHard") };
  const diffRow = (item) => {
    const pct = typeof item.accuracy === "number" ? Math.round(item.accuracy * 100) : 0;
    const band = item.difficulty || item.band || "";
    const label = diffBands[band] || band;
    return `<div class="row" style="margin-bottom:8px">
      <span style="min-width:70px">${esc(label)}</span>
      <div class="track" style="flex:1;height:8px;border-radius:4px"><i style="width:${Math.min(pct,100)}%;height:8px;border-radius:4px;background:${pctColor(pct)};display:block"></i></div>
      <span style="min-width:40px;text-align:right;font-size:13px;color:${pctColor(pct)}">${pct}%</span>
      <span class="muted" style="font-size:12px">${item.total || 0}</span>
    </div>`;
  };

  // Task mastery breakdown (from /me/mastery)
  const taskMasteryHtml = mastItems.length ? mastItems.slice(0, 20).map((item) => {
    const taskLabel = item.taskName || item.taskCode || item.task_id || "";
    const pct = typeof item.accuracy === "number" ? Math.round(item.accuracy * 100) : (typeof item.percent === "number" ? Math.round(item.percent) : 0);
    const level = item.level || item.masteryLevel || "";
    const levelColor = level === "mastered" ? "var(--good)" : level === "learning" ? "#f59e0b" : "var(--muted)";
    return `<div style="margin-bottom:8px">
      <div class="row" style="margin-bottom:3px"><span style="font-size:13px">${esc(taskLabel)}</span>${level ? `<span style="font-size:11px;color:${levelColor}">${esc(level)}</span>` : ""}<span class="muted" style="font-size:11px;margin-left:auto">${pct}%</span></div>
      <div class="track" style="height:5px;border-radius:3px"><i style="width:${Math.min(pct,100)}%;height:5px;border-radius:3px;background:${pctColor(pct)};display:block"></i></div>
    </div>`;
  }).join("") : "";

  // Error distribution
  const errHtml = errItems.length ? errItems.map((e) => {
    const label = e.errorType || e.type || "";
    const count = e.count || 0;
    const total = errItems.reduce((s, x) => s + (x.count || 0), 0) || 1;
    const pct = Math.round((count / total) * 100);
    return `<div class="row" style="margin-bottom:6px">
      <span style="min-width:120px;font-size:13px">${esc(label)}</span>
      <div class="track" style="flex:1;height:6px;border-radius:3px"><i style="width:${pct}%;height:6px;border-radius:3px;background:var(--bad);display:block"></i></div>
      <span class="muted" style="font-size:12px">${count}</span>
    </div>`;
  }).join("") : "";

  // Learner profile summary
  const profileHtml = profile && profile.learningStyle ? `<div class="card"><h2>${S.lang === "ar" ? "ملف المتعلم" : "Learner Profile"}</h2>
    ${profile.learningStyle ? `<p style="font-size:14px"><strong>${S.lang === "ar" ? "أسلوب التعلم:" : "Learning style:"}</strong> ${esc(profile.learningStyle)}</p>` : ""}
    ${profile.strengths?.length ? `<p style="font-size:14px"><strong>${S.lang === "ar" ? "نقاط القوة:" : "Strengths:"}</strong> ${esc(profile.strengths.join(", "))}</p>` : ""}
    ${profile.weaknesses?.length ? `<p style="font-size:14px"><strong>${S.lang === "ar" ? "نقاط الضعف:" : "Areas to improve:"}</strong> ${esc(profile.weaknesses.join(", "))}</p>` : ""}
    ${profile.recommendation ? `<p style="font-size:14px;color:var(--primary)">${esc(profile.recommendation)}</p>` : ""}
  </div>` : "";

  paint(seq, `<h1>${t("statsTitle")}</h1>
    ${profileHtml}
    ${domItems.length ? `<div class="card"><h2>${t("domainAnalytics")}</h2>${domItems.map(masteryBar).join("")}</div>` : ""}
    ${diffItems.length ? `<div class="card"><h2>${t("difficultyAnalytics")}</h2>${diffItems.map(diffRow).join("")}</div>` : ""}
    ${taskMasteryHtml ? `<div class="card"><h2>${S.lang === "ar" ? "إتقان المهام" : "Task mastery"}</h2>${taskMasteryHtml}</div>` : ""}
    ${errHtml ? `<div class="card"><h2>${S.lang === "ar" ? "أنواع الأخطاء" : "Error types"}</h2>${errHtml}</div>` : ""}
    ${!domItems.length && !diffItems.length && !taskMasteryHtml && !errHtml ? `<p class="muted">${t("noStats")}</p>` : ""}
    <p class="muted">${t("estimate")}</p>`);
}

// ------------------------------------------------------------ router

async function render() {
  S.seq = (S.seq || 0) + 1;
  clearTimers();
  const [route, arg] = location.hash.slice(1).split("?")[0].split("/");
  if (route === "verify") return verifyEmail();
  if (route === "verify-cert") return await verifyCertificate(arg);
  if (!S.access) {
    if (["register", "forgot", "reset"].includes(route)) return authView(route);
    return authView("signin");
  }
  try {
    if (route === "welcome") return welcomeView();
    if (route === "practice") return arg === "run" ? await practiceRunView() : await practiceSetupView();
    if (route === "plan") return await planView();
    if (route === "mock") return await mockHomeView();
    if (route === "exam") return await examView();
    if (route === "result") return await resultView(arg);
    if (route === "answers") return await answersView(arg);
    if (route === "stats") return await statsView();
    if (route === "analytics") return await analyticsView();
    if (route === "study-plan") return await studyPlanView();
    if (route === "case-studies") return await caseStudiesView();
    if (route === "case-study") return await caseStudyView(arg);
    if (route === "certificates") return await certificatesView();
    if (route === "bookmarks") return await bookmarksView();
    if (route === "notifications") return await notificationsView();
    if (route === "tips") return await tipsView();
    if (route === "settings") return settingsView();
    return await homeView();
  } catch (e) {
    if (e instanceof ApiError && e.status === 401) { S.access = null; return authView("signin"); }
    shell(`<p class="msg err">${esc(errText(e))}</p>`);
  }
}
window.addEventListener("hashchange", render);
setLang((navigator.language || "en").toLowerCase().startsWith("ar") ? "ar" : "en");
// If loaded from a path like /verify-cert/<token>, redirect to #verify-cert/<token> (server serves index.html for those paths)
(function redirectVerifyCert() {
  const m = location.pathname.match(/^\/verify-cert\/([0-9a-f]{32})$/i);
  if (m) { history.replaceState(null, "", location.origin + "/app"); location.hash = "#verify-cert/" + m[1]; }
})();
// Public links (terms, privacy, support) come from the server's settings.
raw("GET", "/site").then((site) => { S.site = site; }, () => { S.site = null; }).finally(() => { paintNet(); render(); });
</script>
