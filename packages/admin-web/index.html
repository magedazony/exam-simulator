<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Bank Admin</title>

<style>
/* Layout idea: dense desktop tool; left navigation, one working pane, candidate preview beside the editor. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --border: #d5dbe3; --text: #121a26; --muted: #505c6c;
  --primary: #1b4a78; --primary-soft: #e3edf7; --on-primary: #ffffff;
  --good: #17694a; --good-soft: #e1f3ea; --bad: #a3281c; --bad-soft: #fbe6e3; --warn: #8a5a00; --warn-soft: #fbefd2;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1319; --surface: #18202a; --border: #2c3846; --text: #eef1f5; --muted: #a3afbd;
    --primary: #86b8ea; --primary-soft: #1c2f44; --on-primary: #0b1620;
    --good: #63cf98; --good-soft: #15301f; --bad: #f29186; --bad-soft: #3a1b18; --warn: #e6b955; --warn-soft: #35290f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
#app { display: grid; grid-template-columns: 210px 1fr; min-height: 100%; }
#app.signed-out { grid-template-columns: 1fr; place-items: center; }
nav { background: var(--surface); border-inline-end: 1px solid var(--border); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
nav .brand { font-weight: 600; font-size: 15px; padding: 0 8px 12px; }
nav a { color: var(--text); text-decoration: none; padding: 8px 10px; border-radius: 6px; }
nav a[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
nav .who { margin-top: auto; padding: 10px 8px 0; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
main { padding: 20px 24px 40px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 20px; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } #app { grid-template-columns: 1fr; } nav { flex-direction: row; flex-wrap: wrap; } nav .who { margin: 0; border: 0; } }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
label.inline { flex-direction: row; align-items: center; gap: 6px; font-weight: 500; color: var(--text); font-size: 14px; }
input, select, textarea { font: inherit; font-weight: 400; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; min-height: 36px; }
textarea { min-height: 84px; resize: vertical; }
input[type="checkbox"] { min-height: 0; width: 16px; height: 16px; }
input:disabled, select:disabled, textarea:disabled { opacity: .7; }
button { font: inherit; font-weight: 600; min-height: 36px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
button.danger { border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: start; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--primary-soft); }
.wrap { overflow-x: auto; }
.code { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; direction: ltr; unicode-bidi: isolate; }
.code.wrapok { white-space: normal; }
[dir="rtl"] th { letter-spacing: 0; text-transform: none; }
.langbtn { align-self: flex-start; margin: 0 8px 10px; min-height: 30px; padding: 3px 10px; font-weight: 500; }
.login .langbtn { margin: 0; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; border: 1px solid var(--border); white-space: nowrap; }
.pill.draft { color: var(--muted); }
.pill.expert_review, .pill.language_qa { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.pill.approved { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
.pill.published, .pill.valid, .pill.active { color: var(--good); border-color: var(--good); background: var(--good-soft); }
.pill.withdrawn, .pill.invalid, .pill.retired { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.pill.duplicate { color: var(--warn); border-color: var(--warn); }
.msg { padding: 9px 12px; border-radius: 6px; }
.msg.err { background: var(--bad-soft); color: var(--bad); }
.msg.ok { background: var(--good-soft); color: var(--good); }
#opts { display: flex; flex-direction: column; gap: 14px; }
.opt-row { display: grid; grid-template-columns: 26px 1fr 90px; gap: 8px; align-items: start; }
.opt-row .letter { font-weight: 600; padding-top: 8px; }
.opt-row textarea { min-height: 38px; }
.preview .stem { white-space: pre-wrap; }
.preview ol { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; }
.preview li.key { color: var(--good); font-weight: 600; }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.codes { font-family: var(--mono); font-size: 15px; display: grid; grid-template-columns: repeat(2, max-content); gap: 4px 28px; }
.login { width: min(380px, calc(100vw - 32px)); }
.exhibits { display: flex; flex-direction: column; gap: 10px; }
.exhibit { border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.exhibit img { align-self: flex-start; max-width: 100%; max-height: 420px; height: auto; object-fit: contain; border-radius: 4px; background: #fff; image-rendering: auto; }
.exhibit table { font-size: 13px; }
.exhibit .alt { font-size: 12.5px; color: var(--muted); }
.secret { font-family: var(--mono); word-break: break-all; background: var(--bg); padding: 8px; border-radius: 6px; }
</style>
</head>

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const has = (...roles) => roles.some((r) => S.me && S.me.roles.includes(r));

class ApiError extends Error {
  constructor(status, body) { super(body.title || "Request failed"); this.status = status; this.code = body.code; this.errors = body.errors || []; }
  describe() { return this.errors.length ? this.message + ": " + this.errors.map((e) => (e.field ? e.field + " " : "") + e.message).join("; ") : this.message; }
}

async function raw(method, path, body, token) {
  const headers = { "accept-language": S.lang };
  if (token) headers.authorization = "Bearer " + token;
  if (body !== undefined) headers["content-type"] = "application/json";
  const r = await fetch(API + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const text = await r.text();
  const data = text ? JSON.parse(text) : {};
  if (!r.ok) throw new ApiError(r.status, data);
  return data;
}

async function api(method, path, body) {
  try {
    return await raw(method, path, body, S.access);
  } catch (e) {
    if (!(e instanceof ApiError) || e.status !== 401 || !S.refresh) throw e;
    // The access token lasts 15 minutes; renew it once and retry.
    const t = await raw("POST", "/auth/refresh", { refreshToken: S.refresh });
    S.access = t.accessToken; S.refresh = t.refreshToken;
    return raw(method, path, body, S.access);
  }
}

function flash(kind, text) { S.flash = { kind, text }; }
function showError(e) { flash("err", e instanceof ApiError ? e.describe() : t("Something went wrong. Check the server and try again.")); render(); }

function loginView(step) {
  const app = $("#app");
  app.className = "signed-out";
  if (step === "enrol") {
    app.innerHTML = `<div class="panel login"><h1>${t("Set up two-factor sign-in")}</h1>
      <p class="muted">${t("Staff tools need a code from an authenticator app. Add this key to the app, then enter the six-digit code it shows.")}</p>
      <div class="secret" id="secret">${t("Preparing a key…")}</div>
      <label>${t("Six-digit code")}<input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>
      <div id="msg"></div><button class="primary" id="enable">${t("Turn on two-factor sign-in")}</button></div>`;
    api("POST", "/auth/mfa/setup").then((r) => { $("#secret").innerHTML = `<strong id="secret-key">${esc(r.secret)}</strong><br><span class="muted">${t("Or use this link in an app that accepts it:")} <span dir="ltr">${esc(r.otpauthUri)}</span></span>`; }, (e) => { $("#msg").innerHTML = `<p class="msg err">${esc(e.describe ? e.describe() : e.message)}</p>`; });
    $("#enable").onclick = async () => {
      try {
        const r = await api("POST", "/auth/mfa/enable", { code: $("#mfa-code").value.trim() });
        app.innerHTML = `<div class="panel login"><h1>${t("Save your recovery codes")}</h1>
          <p>${t("Each code signs you in once if you lose your authenticator. They are shown only now.")}</p>
          <div class="codes">${r.recoveryCodes.map((c) => `<span>${esc(c)}</span>`).join("")}</div>
          <button class="primary" id="again">${t("I saved them. Sign in again")}</button></div>`;
        $("#again").onclick = () => { S.access = S.refresh = null; loginView(); };
      } catch (e) { $("#msg").innerHTML = `<p class="msg err">${esc(e.describe ? e.describe() : e.message)}</p>`; }
    };
    return;
  }
  app.innerHTML = `<form class="panel login" id="login"><h1>${t("Question bank admin")}</h1>
    <label>${t("Email")}<input id="email" dir="ltr" type="email" autocomplete="username" required></label>
    <label>${t("Password")}<input id="password" type="password" autocomplete="current-password" required></label>
    <label>${t("Code from authenticator app, or a recovery code")}<input id="otp" autocomplete="one-time-code" placeholder="123456"></label>
    <div id="msg"></div><button class="primary" type="submit">${t("Sign in")}</button><button type="button" class="langbtn" data-lang>${S.lang === "ar" ? "English" : "العربية"}</button></form>`;
  $("[data-lang]").onclick = () => { setLang(S.lang === "ar" ? "en" : "ar"); loginView(); };
  $("#login").onsubmit = async (ev) => {
    ev.preventDefault();
    const body = { email: $("#email").value.trim(), password: $("#password").value };
    const otp = $("#otp").value.trim();
    if (otp) body.otp = otp;
    try {
      const t = await raw("POST", "/auth/login", body);
      S.access = t.accessToken; S.refresh = t.refreshToken;
      S.me = await api("GET", "/me");
      if (S.me.language) setLang(S.me.language);
      if (!has("content_author", "content_reviewer", "administrator")) { S.access = null; throw new ApiError(403, { title: t("This account has no staff role") }); }
      try { await api("GET", "/admin/questions?limit=1"); }
      // A staff account without two-factor sign-in gets here: enrol first.
      catch (e) { if (e.code === "mfa_required") return loginView("enrol"); throw e; }
      S.blueprint = await api("GET", "/blueprints/active");
      location.hash = "#queue"; render();
    } catch (e) {
      const text = e.code === "mfa_required" ? t("Enter the code from your authenticator app.") : e instanceof ApiError ? e.describe() : t("Cannot reach the server.");
      $("#msg").innerHTML = `<p class="msg err">${esc(text)}</p>`;
    }
  };
}

function table(rows, cols, onClick) {

}

function exhibitHtml(e, i, editable) {
  const body = e.kind === "image"
    ? `<img src="${esc(e.url)}" alt="${esc(e.altText)}">`
    : `<div class="wrap" dir="auto"><table><thead><tr>${e.table.header.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${e.table.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return `<div class="exhibit">${body}<span class="alt">${t("Alternative text:")} <span dir="auto">${esc(e.altText)}</span></span>${editable ? `<button type="button" data-remove-exhibit="${i}">${t("Remove")}</button>` : ""}</div>`;
}

// Editable list of exhibits. Calls onChange with the new list after every change.
function mountExhibits(root, list, max, editable, onChange) {
  const draw = () => {
    root.innerHTML = `<div class="exhibits">${list.map((e, i) => exhibitHtml(e, i, editable)).join("") || `<p class="muted">${t("No exhibits.")}</p>`}</div>` +
      (editable && list.length < max ? `<details><summary>${t("Add an exhibit ({n} of {max})", { n: list.length, max })}</summary><div class="panel" style="margin-top:8px">
        <label>${t("Alternative text, read aloud by screen readers")}<input class="ex-alt" maxlength="500" dir="auto"></label>
        <label>${t("Image (PNG, JPEG or WebP, at most 1 MiB)")}<input type="file" class="ex-file" accept="image/png,image/jpeg,image/webp"></label>
        <label>${t("Or a table: first line headings, one row per line, cells separated by |")} <textarea dir="auto" class="ex-table" placeholder="Measure | Value&#10;PV | 200,000"></textarea></label>
        <button type="button" class="ex-add">${t("Add exhibit")}</button><div class="ex-msg"></div></div></details>` : "");
    root.querySelectorAll("[data-remove-exhibit]").forEach((b) => (b.onclick = () => { list.splice(Number(b.dataset.removeExhibit), 1); draw(); onChange(list); }));
    const add = root.querySelector(".ex-add");
    if (!add) return;
    add.onclick = async () => {
      const altText = root.querySelector(".ex-alt").value.trim();
      const file = root.querySelector(".ex-file").files[0];
      const tableText = root.querySelector(".ex-table").value.trim();
      try {
        let body;
        if (file) {
          const bytes = new Uint8Array(await file.arrayBuffer());
          let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
          body = { kind: "image", mimeType: file.type, dataBase64: btoa(bin), altText };
        } else if (tableText) {
          const lines = tableText.split(/\r?\n/).filter((l) => l.trim()).map((l) => l.split("|").map((c) => c.trim()));
          body = { kind: "table", altText, table: { header: lines[0], rows: lines.slice(1) } };
        } else { root.querySelector(".ex-msg").innerHTML = `<p class="msg err">${t("Choose an image or type a table.")}</p>`; return; }
        list.push(await api("POST", "/admin/exhibits", body));
        draw(); onChange(list);
      } catch (e) { root.querySelector(".ex-msg").innerHTML = `<p class="msg err">${esc(e.describe ? e.describe() : e.message)}</p>`; }
    };
  };
  draw();
}

// CSV with quoted fields (RFC 4180). Excel files are turned into rows by the server.
function parseCsv(text) {
  const rows = []; let row = [], field = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) { if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; } else if (ch === '"') quoted = false; else field += ch; }
    else if (ch === '"') quoted = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(field); rows.push(row); row = []; field = ""; }
    else field += ch;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim() !== ""));
}
function csvToDrafts(text) { return gridToDrafts(parseCsv(text.replace(/^﻿/, ""))); }
// Rows of cells, from CSV or an Excel sheet, to question drafts. The first row names the columns.
function gridToDrafts(grid) {
  const [head, ...body] = grid.map((r) => r.map((c) => String(c ?? "")));
  if (!head) return [];
  const idx = Object.fromEntries(head.map((h, i) => [h.trim().toLowerCase(), i]));
  const get = (r, k) => (idx[k] === undefined ? "" : (r[idx[k]] || "").trim());
  return body.map((r) => {
    const correct = get(r, "correct").toUpperCase().split(/[;\s,]+/).filter(Boolean);
    const options = [];
    for (const L of "ABCDEF") { const t = get(r, "option" + L.toLowerCase()); if (t) { const o = { text: t, isCorrect: correct.includes(L), rationale: get(r, "rationale" + L.toLowerCase()) }; const tar = get(r, "option" + L.toLowerCase() + "ar"); if (tar) o.textAr = tar; const rar = get(r, "rationale" + L.toLowerCase() + "ar"); if (rar) o.rationaleAr = rar; options.push(o); } }
    const d = { taskCode: get(r, "taskcode"), approach: get(r, "approach").toLowerCase(), difficulty: get(r, "difficulty").toLowerCase(), type: get(r, "type").toLowerCase() || (correct.length > 1 ? "multiple" : "single"), stem: get(r, "stem"), options };
    if (get(r, "stemar")) d.stemAr = get(r, "stemar");
    if (get(r, "language")) d.language = get(r, "language").toLowerCase();
    if (get(r, "aiassisted")) d.aiAssisted = /^(true|1|yes|y)$/i.test(get(r, "aiassisted"));
    if (get(r, "casekey")) d.caseKey = get(r, "casekey");
    if (get(r, "whycorrect")) d.explanation = { whyCorrect: get(r, "whycorrect"), mindset: get(r, "mindset") || null, keyConcept: get(r, "keyconcept") || null, learningObjective: get(r, "learningobjective") || null };
    if (get(r, "whycorrectar")) d.explanationAr = { whyCorrect: get(r, "whycorrectar"), mindset: get(r, "mindstar") || null, keyConcept: get(r, "keyconceptar") || null, learningObjective: get(r, "learningobjectivear") || null };
    return d;
  });
}

/** Case studies from a sheet named like "Case studies": columns caseKey, title, scenario. */
function gridToCases(grid) {
  const [head, ...body] = grid.map((r) => r.map((c) => String(c ?? "").trim()));
  if (!head) return [];
  const idx = Object.fromEntries(head.map((h, i) => [h.toLowerCase(), i]));
  return body.map((r) => ({ key: r[idx.casekey] || "", title: r[idx.title] || "", scenario: r[idx.scenario] || "" })).filter((c) => c.key);
}

function importView() {
  let rows = null, cases = [];
  shell(t("Import questions"), `<div class="panel"><p>${t("Upload an Excel (.xlsx), CSV or JSON file of up to 500 questions. Columns:")} <span class="code wrapok">taskCode, approach, difficulty, type, stem, optionA … optionF, correct, rationaleA … rationaleF, whyCorrect, mindset, keyConcept, learningObjective, language, aiAssisted, caseKey</span>. ${t("Arabic columns (optional):")} <span class="code wrapok">stemAr, optionAAr … optionFAr, rationaleAAr … rationaleFFAr, whyCorrectAr, mindsetAr, keyConceptAr</span>. <span class="code">correct</span> ${t("holds letters, such as")} <span class="code">B</span> ${t("or")} <span class="code">A;C</span>. ${t("Excel files: questions on the first sheet, first row for column names. Optional columns aiAssisted and caseKey; a sheet named Case studies (caseKey, title, scenario) creates case-study drafts.")}</p>
    <p class="muted">${t("Every imported row becomes a draft and goes through the full review.")}</p>
    <div class="row"><input type="file" id="file" accept=".xlsx,.csv,.json,text/csv,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><button id="check" disabled>${t("Check rows")}</button><button class="primary" id="commit" disabled>${t("Import valid rows as drafts")}</button></div></div><div id="report"></div>`);
  $("#file").onchange = async () => {
    const f = $("#file").files[0]; if (!f) return;
    const name = f.name.toLowerCase();
    $("#check").disabled = $("#commit").disabled = true;
    try {
      if (name.endsWith(".xlsx")) {
        const bytes = new Uint8Array(await f.arrayBuffer());
        let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
        const book = await api("POST", "/admin/imports/spreadsheet", { dataBase64: btoa(bin) });
        rows = gridToDrafts(book.rows);
        const caseSheet = (book.sheets || []).find((sh) => /case/i.test(sh.name));
        cases = caseSheet ? gridToCases(caseSheet.rows) : [];
      } else {
        const text = await f.text();
        rows = name.endsWith(".json") ? JSON.parse(text) : csvToDrafts(text);
        if (!Array.isArray(rows)) rows = rows.rows;
      }
      if (!Array.isArray(rows)) throw new Error("no rows");
      $("#check").disabled = false;
      const unknown = [...new Set(rows.map((r) => r.caseKey).filter((k) => k && !cases.some((c) => c.key === k)))];
      $("#report").innerHTML = `<p class="muted">${esc(t("{n} rows read from {file}.", { n: rows.length, file: f.name }))}${cases.length ? " " + esc(t("{n} case studies.", { n: cases.length })) : ""}</p>`
        + (unknown.length ? `<p class="msg err">${esc(t("Unknown case keys: {keys}", { keys: unknown.join(", ") }))}</p>` : "");
      if (unknown.length) $("#check").disabled = true;
    } catch (e) {
      $("#report").innerHTML = `<p class="msg err">${esc(e instanceof ApiError ? e.describe() : t("The file could not be read. Check that it is a valid Excel, CSV or JSON file."))}</p>`;
    }
  };
  const send = async (commit) => {
    try {
      let payload = rows.map(({ caseKey, ...d }) => d);
      if (commit && cases.length) {
        // Create each case study that valid rows use, then attach those rows to it.
        const check = await api("POST", "/admin/imports", { rows: payload, commit: false });
        const used = new Set(rows.filter((r, i) => r.caseKey && check.rows[i].status === "valid").map((r) => r.caseKey));
        const ids = {};
        for (const c of cases.filter((c) => used.has(c.key))) ids[c.key] = (await api("POST", "/admin/case-studies", { title: c.title, scenario: c.scenario })).id;
        payload = rows.map(({ caseKey, ...d }) => (caseKey && ids[caseKey] ? { ...d, caseStudyId: ids[caseKey] } : d));
        flash("ok", t("{n} case studies created as drafts.", { n: Object.keys(ids).length }));
      }
      const r = await api("POST", "/admin/imports", { rows: payload, commit });
      const sum = r.summary;
      $("#report").innerHTML = `<div class="panel"><h2>${commit ? t("Imported") : t("Check result")}: ${t("{v} valid, {i} invalid, {d} duplicates", { v: sum.valid, i: sum.invalid, d: sum.duplicates })}${commit ? t(", {c} stored as drafts", { c: sum.committed }) : ""}</h2>
        ${table(r.rows, [["Row", (x) => x.row], ["Result", (x) => pill(x.status)], ["Problems", (x) => esc(x.errors.map((e) => e.field + ": " + e.message).join("; "))]])}</div>`;
      $("#commit").disabled = commit || sum.valid === 0;
    } catch (e) { showError(e); }
  };
  $("#check").onclick = () => send(false);
  $("#commit").onclick = () => send(true);
}

  const priceCell = (p, region) => { const x = p.prices.find((y) => y.region === region); return x ? `${esc(money(x))}${x.storeProductId ? `<br><span class="code muted">${esc(x.storeProductId)}</span>` : ""}` : `<span class="muted">${t("Not set")}</span>`; };
  shell(t("Plans and access"), `<div class="panel"><h2>${t("Prices")}</h2><p class="muted">${t("Prices are set here, never in the app code. A plan without a price in a region is not offered for sale there. Store product ids must match the products created in App Store Connect and Google Play Console.")}</p>
      ${table(plans, [["Plan", (p) => `${esc(planName(p))} <span class="code muted">${esc(p.code)}</span>`], ["Length", (p) => (p.durationDays ? t("{n} days", { n: p.durationDays }) : "–")], ...REGIONS.map(([k, n]) => [n, (p) => (p.kind === "free" ? "–" : priceCell(p, k))])])}
      <form id="price" class="row" style="align-items:flex-end;margin-top:12px">
        <label>${t("Plan")}<select id="pr-plan">${planOptions}</select></label>
        <label>${t("Region")}<select id="pr-region">${REGIONS.map(([k, n]) => `<option value="${k}">${t(n)}</option>`).join("")}</select></label>
        <label>${t("Currency")}<input id="pr-cur" maxlength="3" size="4" placeholder="EGP" required></label>
        <label>${t("Price")}<input id="pr-amount" inputmode="decimal" size="8" placeholder="499.00" required></label>
        <label>${t("Store product id (optional)")}<input id="pr-product" size="22"></label>
        <button class="primary" type="submit">${t("Save price")}</button></form></div>
    <div class="panel"><h2>${t("Access codes")}</h2><p class="muted">${t("Single-use codes for training courses and partners. Each code gives one pass. Codes are shown once; only a fingerprint of each is stored, so copy them before leaving this page.")}</p>
      <form id="codes-form" class="row" style="align-items:flex-end">
        <label>${t("Plan")}<select id="ac-plan">${planOptions}</select></label>
        <label>${t("Days of access")}<input id="ac-days" type="number" min="1" max="365" value="30" size="5"></label>
        <label>${t("How many")}<input id="ac-count" type="number" min="1" max="500" value="20" size="5"></label>
        <label style="flex:1">${t("Batch name")}<input id="ac-label" placeholder="${t("Cairo course, January 2027")}" maxlength="100"></label>
        <label>${t("Redeem by (optional)")}<input id="ac-exp" type="date"></label>
        <button class="primary" type="submit">${t("Create codes")}</button></form><div id="ac-out"></div></div>
    <div class="panel"><h2>${t("Give a pass to a person")}</h2><p class="muted">${t("For example a replacement after a refund dispute or a partner account. It starts when any current pass ends.")}</p>
      <form id="grant" class="row" style="align-items:flex-end">
        <label style="flex:1">${t("Email")}<input id="gr-email" type="email" dir="ltr" required></label>
        <label>${t("Plan")}<select id="gr-plan">${planOptions}</select></label>
        <label>${t("Days")}<input id="gr-days" type="number" min="1" max="365" value="30" size="5"></label>
        <label style="flex:1">${t("Reason")}<input id="gr-note" maxlength="500"></label>
        <button class="primary" type="submit">${t("Give pass")}</button></form><div id="gr-out"></div></div>`);
  $("#price").onsubmit = async (ev) => {
    ev.preventDefault();
    const currency = $("#pr-cur").value.trim().toUpperCase();
    const amount = Number($("#pr-amount").value.replace(/,/g, ""));
    if (!/^[A-Z]{3}$/.test(currency) || !Number.isFinite(amount) || amount < 0) return showError(new Error(t("Enter a three-letter currency code and a price, such as EGP and 499.00.")));
    const body = { currency, amountMinor: Math.round(amount * 10 ** minorDigits(currency)) };
    const product = $("#pr-product").value.trim(); if (product) body.storeProductId = product;
    try { await api("PUT", `/admin/plans/${$("#pr-plan").value}/prices/${$("#pr-region").value}`, body); flash("ok", t("Price saved.")); render(); } catch (e) { showError(e); }
  };
  $("#codes-form").onsubmit = async (ev) => {
    ev.preventDefault();
    const body = { planCode: $("#ac-plan").value, days: Number($("#ac-days").value), count: Number($("#ac-count").value), label: $("#ac-label").value.trim() };
    if ($("#ac-exp").value) body.expiresAt = new Date($("#ac-exp").value + "T23:59:59Z").toISOString();
    try {
      const r = await api("POST", "/admin/access-codes", body);
      $("#ac-out").innerHTML = `<p class="msg ok">${esc(t("{n} codes created for “{label}”. Copy them now; they are not shown again.", { n: r.codes.length, label: r.label }))}</p>
        <textarea id="ac-codes" readonly dir="ltr" rows="${Math.min(12, r.codes.length)}" class="code">${esc(r.codes.join("\n"))}</textarea>`;
    } catch (e) { $("#ac-out").innerHTML = `<p class="msg err">${esc(e.describe ? e.describe() : e.message)}</p>`; }
  };
  $("#grant").onsubmit = async (ev) => {
    ev.preventDefault();
    const email = $("#gr-email").value.trim().toLowerCase();
    try {
      const found = (await api("GET", "/admin/users?q=" + encodeURIComponent(email))).items.find((u) => u.email.toLowerCase() === email);
      if (!found) { $("#gr-out").innerHTML = `<p class="msg err">${t("No account with this email.")}</p>`; return; }
      const body = { planCode: $("#gr-plan").value, days: Number($("#gr-days").value) };
      if ($("#gr-note").value.trim()) body.note = $("#gr-note").value.trim();
      const a = await api("POST", `/admin/users/${found.id}/grant`, body);
      $("#gr-out").innerHTML = `<p class="msg ok">${esc(t("{email} has access until {date}.", { email: found.email, date: new Date(a.endsAt).toLocaleDateString(dateFmt(), { day: "numeric", month: "long", year: "numeric" }) }))}</p>`;
    } catch (e) { $("#gr-out").innerHTML = `<p class="msg err">${esc(e.describe ? e.describe() : e.message)}</p>`; }
  };
}

async function auditView() {
  const params = new URLSearchParams(location.hash.split("?")[1] || "");
  const action = params.get("action") || "", actor = params.get("actor") || "";
  let rows = [], cursor = null;
  const load = async () => {
    const q = new URLSearchParams({ limit: "50" });
    if (action) q.set("action", action);
    if (actor) q.set("actor", actor);
    if (cursor) q.set("cursor", cursor);
    const r = await api("GET", "/admin/audit?" + q);
    rows = rows.concat(r.items); cursor = r.nextCursor;
  };
  await load();
  const ACTIONS = [["", "Any"], ["question", "Questions"], ["case_study", "Case studies"], ["user", "Users and roles"], ["access", "Access and passes"], ["plan", "Prices"], ["blueprint", "Blueprints"], ["exhibit", "Exhibits"]];
  const changes = (x) => { const v = x.after || x.before; if (!v) return ""; const t2 = JSON.stringify(v); return `<span class="code wrapok" dir="ltr">${esc(t2.length > 160 ? t2.slice(0, 159) + "…" : t2)}</span>`; };
  const draw = () => {
    shell(t("Audit log"), `<form class="panel" id="audit-filter"><p class="muted">${t("Every staff action and access change, newest first. Entries cannot be edited or deleted.")}</p><div class="row">
      <label>${t("Area")}<select id="a-action">${ACTIONS.map(([k, n]) => `<option value="${k}"${k === action ? " selected" : ""}>${t(n)}</option>`).join("")}</select></label>
      <label style="flex:1">${t("By (email)")}<input id="a-actor" dir="ltr" value="${esc(actor)}"></label><button type="submit">${t("Apply")}</button></div></form>
      <div class="panel">${table(rows, [["When", (x) => esc(new Date(x.at).toLocaleString(dateFmt()))], ["By", (x) => `<span dir="ltr">${esc(x.actor || "—")}</span>`], ["Action", (x) => `<span class="code">${esc(x.action)}</span>`], ["Item", (x) => `<span class="code">${esc(x.entityType)} ${esc(String(x.entityId).slice(0, 12))}</span>`], ["Details", changes]])}${cursor ? `<button id="more">${t("Load more")}</button>` : ""}</div>`);
    $("#audit-filter").onsubmit = (ev) => { ev.preventDefault(); location.hash = `#audit?action=${encodeURIComponent($("#a-action").value)}&actor=${encodeURIComponent($("#a-actor").value.trim())}`; };
    if (cursor) $("#more").onclick = async () => { await load(); draw(); };
  };
  draw();
}

function securityView() {
  shell(t("Security"), `<div class="panel"><h2>${t("Recovery codes")}</h2><p>${t("Make a new set of ten recovery codes. The old set stops working at once.")}</p><button id="regen">${t("Make new recovery codes")}</button><div id="codes"></div></div>`);
  $("#regen").onclick = async () => { try { const r = await api("POST", "/auth/mfa/recovery-codes"); $("#codes").innerHTML = `<p class="msg ok">${t("Save these now. They are shown only once.")}</p><div class="codes">${r.recoveryCodes.map((c) => `<span>${esc(c)}</span>`).join("")}</div>`; } catch (e) { showError(e); } };
}

async function difficultyAdminView() {
  const minAttempts = Number(new URLSearchParams(location.hash.split("?")[1] || "").get("min") || 5);
  shell(`<h1>Question Difficulty</h1><p class="muted">Loading…</p>`);
  let data;
  try { data = await api("GET", `/admin/question-difficulty?limit=100&min_attempts=${minAttempts}`); }
  catch (e) { shell(`<h1>Question Difficulty</h1><p class="muted error">${esc(e.message)}</p>`); return; }
  const rows = data.items || [];
  const domainColors = { "People": "var(--primary)", "Process": "#f59e0b", "Business": "#10b981" };
  shell(`<h1>Question Difficulty</h1>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
      <label>Min attempts:
        <select id="minSel" onchange="location.hash='#difficulty?min='+this.value">
          ${[3,5,10,20,50].map((v) => `<option value="${v}"${v === minAttempts ? " selected" : ""}>${v}</option>`).join("")}
        </select>
      </label>
      <span class="muted">${rows.length} questions shown — highest difficulty_score first (1 = hardest)</span>
    </div>
    <div style="overflow-x:auto"><table class="data-table">
      <thead><tr><th>#</th><th>Ordinal</th><th>Domain</th><th>Task</th><th>Attempts</th><th>Correct</th><th>Score</th></tr></thead>
      <tbody>${rows.map((r, i) => {
        const pct = r.total_attempts ? Math.round((r.correct_attempts / r.total_attempts) * 100) : 0;
        const color = r.difficulty_score >= 0.7 ? "var(--bad)" : r.difficulty_score >= 0.4 ? "#f59e0b" : "var(--good)";
        const domColor = domainColors[r.eco_domain] || "var(--muted)";
        return `<tr>
          <td>${i + 1}</td>
          <td><a href="#question?id=${esc(r.question_id)}">${r.ordinal || "—"}</a></td>
          <td><span style="color:${domColor};font-weight:600">${esc(r.eco_domain)}</span></td>
          <td style="font-size:12px">${esc(r.eco_task || "—")}</td>
          <td>${r.total_attempts}</td>
          <td>${r.correct_attempts} (${pct}%)</td>
          <td style="font-weight:700;color:${color}">${r.difficulty_score}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="7" class="muted" style="text-align:center">No data yet — questions need ≥${minAttempts} attempts</td></tr>`}
      </tbody>
    </table></div>`);
}

async function certificatesAdminView() {
  const passed = new URLSearchParams(location.hash.split("?")[1] || "").get("passed");
  const offset = Number(new URLSearchParams(location.hash.split("?")[1] || "").get("offset") || 0);
  const limit = 50;
  const qs = new URLSearchParams({ limit: String(limit), offset: String(offset) });
  if (passed !== null) qs.set("passed", passed);
  const r = await api("GET", "/admin/certificates?" + qs);
  const items = r.items || [];
  shell(t("Certificates"), `
    <div class="row" style="gap:8px;margin-bottom:12px">
      <a class="btn small${passed === null ? " primary" : ""}" href="#certificates">${t("All")}</a>
      <a class="btn small${passed === "true" ? " primary" : ""}" href="#certificates?passed=true">${t("Passed")}</a>
      <a class="btn small${passed === "false" ? " primary" : ""}" href="#certificates?passed=false">${t("Not passed")}</a>
    </div>
    ${table(items, [
      ["Token", (c) => `<span dir="ltr" style="font-size:12px">${esc(c.token)}</span>`],
      ["User", (c) => `<span dir="ltr" style="font-size:12px">${esc(c.user_id)}</span>`],
      ["Score", (c) => `${c.score_percent}%`],
      ["Passed", (c) => c.passed ? "✅" : "❌"],
      ["Issued", (c) => new Date(c.issued_at).toLocaleDateString()],
      ["Revoked", (c) => c.revoked_at ? `<span style="color:var(--bad)">Yes</span>` : "No"],
      ["Action", (c) => c.revoked_at
        ? `<button class="small" data-unrevoke="${c.id}">${t("Un-revoke")}</button>`
        : `<button class="small danger" data-revoke="${c.id}">${t("Revoke")}</button>`],
    ])}
    <div style="display:flex;gap:8px;margin-top:12px">
      ${offset > 0 ? `<a class="btn small" href="#certificates?${new URLSearchParams({ passed: passed || '', offset: String(Math.max(0, offset - limit)) })}">${t("← Previous")}</a>` : ""}
      ${items.length === limit ? `<a class="btn small" href="#certificates?${new URLSearchParams({ passed: passed || '', offset: String(offset + limit) })}">${t("Next →")}</a>` : ""}
    </div>`);
  document.addEventListener("click", async (ev) => {
    const btn = ev.target.closest("[data-revoke],[data-unrevoke]");
    if (!btn) return;
    const id = btn.dataset.revoke || btn.dataset.unrevoke;
    const isRevoke = !!btn.dataset.revoke;
    btn.disabled = true;
    try {
      if (isRevoke) {
        const reason = prompt(t("Reason for revocation (optional):")) || "admin_revoke";
        await api("POST", `/admin/certificates/${id}/revoke`, { reason });
      } else {
        await api("DELETE", `/admin/certificates/${id}/revoke`);
      }
      flash("ok", isRevoke ? t("Certificate revoked.") : t("Revocation removed."));
      render();
    } catch (e) { btn.disabled = false; showError(e); }
  }, { once: true });
}

async function render() {
  if (!S.access) return loginView();
  const [route, arg] = location.hash.slice(1).split("?")[0].split("/");
  try {
    if (route === "signout") { try { await api("POST", "/auth/logout"); } catch {} S.access = S.refresh = S.me = null; location.hash = ""; return loginView(); }
    if (route === "questions") return await questionsView();
    if (route === "question") return await questionView(arg);
    if (route === "new") return await questionView(null);
    if (route === "cases") return await casesView();
    if (route === "case") return await caseView(arg);
    if (route === "import") return importView();
    if (route === "blueprints") return await blueprintsView();
    if (route === "reports") return await reportsView();
    if (route === "users") return await usersView();
    if (route === "difficulty") return await difficultyAdminView();
    if (route === "certificates") return await certificatesAdminView();
    if (route === "security") return securityView();
    if (route === "access") return await accessView();
    if (route === "audit") return await auditView();
    return await queueView();
  } catch (e) {
    if (e instanceof ApiError && e.status === 401) { S.access = null; return loginView(); }
    shell(t("Problem"), `<p class="msg err">${esc(e instanceof ApiError ? e.describe() : t("Cannot reach the server."))}</p>`);
  }
}
window.addEventListener("hashchange", render);
setLang((navigator.language || "en").toLowerCase().startsWith("ar") ? "ar" : "en");
render();
</script>
</body>
</html>
