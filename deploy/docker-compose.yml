# One-server deployment: PostgreSQL, a one-off migration, the application,
# Caddy in front (automatic HTTPS from Let's Encrypt) and daily backups.
#
#   cp deploy/.env.example deploy/.env      # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env run --rm app node scripts/create-admin.ts --email you@example.com
#
# See DEPLOY.md for the full procedure, updates and restores.
name: exam-simulator

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-exam}
      POSTGRES_USER: ${PGUSER:-exam}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in deploy/.env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: only the containers on this network reach the database.

  migrate:
    image: exam-simulator:latest
    build: ..
    env_file: .env
    environment: &dbenv
      PGHOST: db
      PGPORT: "5432"
      PGSSLMODE: disable # same private network; use require or verify-full for a managed database
    command: ["node", "scripts/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: exam-simulator:latest
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *dbenv
      TRUST_PROXY_HOPS: "1" # Caddy
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    volumes:
      # Google Play service-account key, if used: GOOGLE_SERVICE_ACCOUNT_FILE=/run/secrets/google/key.json
      - ./secrets:/run/secrets/google:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      <<: *dbenv
      PGDATABASE: ${PGDATABASE:-exam}
      PGUSER: ${PGUSER:-exam}
      PGPASSWORD: ${PGPASSWORD}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ../scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ../scripts/restore.sh:/usr/local/bin/restore.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    # A backup when the service starts, then every 24 hours. Copy BACKUP_HOST_DIR off this server too.
    entrypoint: ["/bin/sh", "-c", "while true; do sh /usr/local/bin/backup.sh || echo 'backup failed'; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
