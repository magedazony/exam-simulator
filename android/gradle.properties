# ---------------------------------------------------------------------------
# Change these four values before the first build. See PUBLISH.md.
# ---------------------------------------------------------------------------
# Unique id of the app on Google Play. Cannot be changed after the first upload.
appId=com.example.examsimulator
# The web address the app opens: your production domain, https only.
siteHost=exam.example.com
launchPath=/app
# Name under the icon (max ~12 characters) and in the store.
appName=Exam Simulator
# Increase versionCode by one for every upload to Google Play.
versionCode=1
versionName=1.0.0

# Libraries (update to the newest versions Android Studio suggests).
# Google Play requires Play Billing Library 8 or newer from 31 August 2026;
# the billing helper must be a version built on it.
browserHelperVersion=2.7.4
billingHelperVersion=1.1.0

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
