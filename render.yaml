# Free trial deployment on Render (web service) with a free Neon database.
# See FREE-HOSTING.md. Not for real candidates: the free service sleeps when
# idle and this configuration runs in development mode (emails are printed
# to the service log instead of sent).
services:
  - type: web
    name: exam-simulator
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      # Trial mode: the Dockerfile defaults to production, which refuses DEMO_CONTENT.
      - key: NODE_ENV
        value: development
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MAIL_MODE
        value: log
      - key: TOKEN_SECRET
        generateValue: true
      - key: PGSSLMODE
        value: verify-full
      - key: PGPOOL_MAX
        value: "5"
      # Fill these in on Render (Environment): values from Neon and your choices.
      - key: PGHOST
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_CONTENT
        value: "1"
      # Optional: SMTP for real email delivery.
      # Leave these out (or keep MAIL_MODE=log) on the free trial tier —
      # confirmation links will appear in the Render Logs instead.
      # Set MAIL_MODE=smtp and fill in the SMTP_* vars for real delivery.
      # - key: MAIL_MODE
      #   value: smtp
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: MAIL_FROM
      #   sync: false
      # Optional: legal pages (required in production / NODE_ENV=production)
      # - key: TERMS_URL
      #   value: https://<your-domain>.onrender.com/terms
      # - key: PRIVACY_URL
      #   value: https://<your-domain>.onrender.com/privacy
      # - key: SUPPORT_EMAIL
      #   sync: false
